# Innovation Radar - CORDIS vertical mapping.
#
# Primary signal is the EU funding-programme code (legalBasis), which encodes the
# funding priority an application area sits under - not the scientific field.
# CORDIS exposes it as the searchable `programme/code` field; a project carries
# every ancestor code, so matching a parent (e.g. HORIZON.2.4) also returns its
# children.
#
# horizon_codes  - Horizon Europe 2021-2027 legalBasis codes. HORIZON.2.1 .. 2.6
#                  are clusters CL1 .. CL6; the .x leaves are the destinations.
#                  Used for the `recent` and `1y_ago` buckets.
# horizon_calls  - call/topic identifiers (HORIZON-CL4-2023-SPACE-01-...), also
#                  indexed under programme/code. Wildcards allowed. These are the
#                  destination-level secondary signal used to split verticals a
#                  cluster code alone conflates (CL4 -> Manufacturing vs Aerospace).
# h2020_codes    - H2020 2014-2020 legalBasis codes, used for the `5y_ago` bucket
#                  (Horizon Europe does not reach back that far).
# keywords       - last-resort free-text fallback, matched against `objective`.
#                  Multi-word values are AND-of-words, not phrase match.
#
# The three are a cascade, not one OR'd query: a time bucket is filled from
# horizon_codes/h2020_codes first and only tops up from horizon_calls, then
# keywords, if it came back short. The DB `confidence` column follows from which
# tier a row came from (good / good / mid), so it is not configured here.
#
# mapping_quality - how clean the vertical's code coverage is. Reference only,
#                   not written to the DB; see ../README.md for what drives it.

Manufacturing:
  horizon_codes: ["HORIZON.2.4.1", "HORIZON.2.4.4", "HORIZON.2.4.8", "HORIZON.2.4.9"]
  horizon_calls: ["HORIZON-CL4-*TWIN-TRANSITION*", "HORIZON-CL4-*RESILIENCE*", "HORIZON-CL4-*MAT-PROD*"]
  h2020_codes: ["H2020-EU.2.1.2.", "H2020-EU.2.1.3.", "H2020-EU.2.1.5."]
  keywords: ["pulp paper production", "wood processing industry"]
  mapping_quality: High

